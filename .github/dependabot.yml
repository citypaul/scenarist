version: 2
updates:
  # npm/pnpm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    # Group minor and patch updates together to reduce PR noise
    groups:
      minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
    # Ignore major TypeScript updates (review manually)
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  # GitHub Actions (workflows + local composite actions)
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Europe/London"
    cooldown:
      default-days: 7
    # One PR per action across all directories, so workflow and composite pins stay in sync
    groups:
      actions-by-name:
        patterns:
          - "*"
        group-by: dependency-name
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
